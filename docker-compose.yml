# Spins up the exact same environment for all 5 team members.
# Usage: docker compose up --build --pull always

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: musclemax_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musclemax}
      POSTGRES_USER: ${POSTGRES_USER:-musclemax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musclemax}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musclemax}"]
      interval: 5s
      timeout: 5s
      retries: 5



  backend:
    build: ./backend
    container_name: musclemax_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musclemax}
      POSTGRES_USER: ${POSTGRES_USER:-musclemax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musclemax}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: musclemax_frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000

volumes:
  pgdata:
  ollama_data:
