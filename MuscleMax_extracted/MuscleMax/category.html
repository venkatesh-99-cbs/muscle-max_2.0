/* ==========================================
   CATEGORY CART
   ========================================== */

function addCategoryToCart(id) {

    let allProducts = [];

    Object.values(categoryProducts)
        .forEach(
            function(categoryItems) {

                allProducts =
                    allProducts.concat(
                        categoryItems
                    );

            }
        );


    const product =
        allProducts.find(
            p => p.id === id
        );


    if (!product || product.price <= 0) {
        return;
    }


    let cart =
        JSON.parse(
            localStorage.getItem(
                "musclemax_cart"
            )
        ) || [];


    const existing =
        cart.find(
            item => item.id === id
        );


    if (existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            ...product,

            quantity: 1

        });

    }


    localStorage.setItem(
        "musclemax_cart",
        JSON.stringify(cart)
    );


    showToast(
        product.name +
        " added to your cart!",
        "🛒"
    );

}


/* ==========================================
   CATEGORY WISHLIST
   ========================================== */

function addCategoryWishlist(id) {

    let allProducts = [];

    Object.values(categoryProducts)
        .forEach(
            function(categoryItems) {

                allProducts =
                    allProducts.concat(
                        categoryItems
                    );

            }
        );


    const product =
        allProducts.find(
            p => p.id === id
        );


    if (!product || product.price <= 0) {
        return;
    }


    let wishlist =
        JSON.parse(
            localStorage.getItem(
                "musclemax_wishlist"
            )
        ) || [];


    const exists =
        wishlist.some(
            item => item.id === id
        );


    if (exists) {

        showToast(
            "This product is already in your wishlist.",
            "♥"
        );

        return;

    }


    wishlist.push(product);


    localStorage.setItem(
        "musclemax_wishlist",
        JSON.stringify(wishlist)
    );


    showToast(
        product.name +
        " added to your wishlist!",
        "♥"
    );

}
