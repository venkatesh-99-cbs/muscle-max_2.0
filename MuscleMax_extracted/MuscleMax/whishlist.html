<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MuscleMax | Wishlist</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        MUSCLEMAX
    </div>

    <a
        href="index.html"
        class="nav-button"
    >
        ← Back to Store
    </a>

</header>


<section class="wishlist-page">

    <div class="wishlist-container">

        <div class="wishlist-title">

            <h1>
                ❤️ YOUR WISHLIST
            </h1>

        </div>


        <div
            id="wishlistItems"
            class="wishlist-grid"
        ></div>

    </div>

</section>


<script>


let wishlist =
    JSON.parse(
        localStorage.getItem(
            "musclemax_wishlist"
        )
    ) || [];


function displayWishlist() {

    const container =
        document.getElementById(
            "wishlistItems"
        );


    if (wishlist.length === 0) {

        container.innerHTML = `

            <div class="empty-cart">

                <h2>
                    Your wishlist is empty
                </h2>

                <p>
                    Add your favorite products here.
                </p>

                <br>

                <a
                    href="index.html"
                    class="btn"
                >
                    SHOP NOW
                </a>

            </div>

        `;

        return;
    }


    container.innerHTML = "";


    wishlist.forEach(
        function(item, index) {

            container.innerHTML += `

                <div class="wishlist-card">

                    <img
                        src="${item.image}"
                    >

                    <h3>
                        ${item.name}
                    </h3>

                    <div class="wishlist-price">
                        ₹${item.price}
                    </div>


                    <div class="wishlist-buttons">

                        <button
                            class="wishlist-cart-btn"
                            onclick="addCart(${index})"
                        >
                            Add to Cart
                        </button>

                        <button
                            class="wishlist-remove-btn"
                            onclick="removeWishlist(${index})"
                        >
                            Remove
                        </button>

                    </div>

                </div>

            `;

        }
    );

}


/* ---------- ADD TO CART ---------- */

function addCart(index) {

    let cart =
        JSON.parse(
            localStorage.getItem(
                "musclemax_cart"
            )
        ) || [];


    const product =
        wishlist[index];


    const existing =
        cart.find(
            item =>
                item.id === product.id
        );


    if (existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            ...product,

            quantity: 1

        });

    }


    localStorage.setItem(

        "musclemax_cart",

        JSON.stringify(cart)

    );


    alert(
        product.name +
        " added to cart!"
    );

}


/* ---------- REMOVE ---------- */

function removeWishlist(index) {

    wishlist.splice(index, 1);


    localStorage.setItem(

        "musclemax_wishlist",

        JSON.stringify(wishlist)

    );


    displayWishlist();

}


displayWishlist();

</script>


</body>
</html>
